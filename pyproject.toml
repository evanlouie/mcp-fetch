[project]
name = "mcp-server-fetch"
version = "0.7.0"
description = "A Model Context Protocol server providing tools to fetch and convert web content for usage by LLMs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anthropic, PBC." }]
maintainers = [{ name = "Jack Adamson", email = "jadamson@anthropic.com" }]
keywords = ["http", "mcp", "llm", "automation"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "curl-cffi>=0.13.0",
    "markdownify>=0.13.1",
    "mcp>=1.1.3",
    "pydantic>=2.0.0",
    "readabilipy>=0.2.0",
]

[project.scripts]
mcp-server-fetch = "mcp_server_fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "basedpyright>=1.31.2",
    "ruff>=0.7.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.basedpyright]
reportMissingTypeStubs = false
reportExplicitAny = false

# Ignore stub files completely to avoid noise from third-party type definitions
ignore = ["typings/**/*.pyi"]

# Allow some reasonable patterns for this codebase
reportUnusedFunction = false  # MCP server handlers are "unused" by design
reportUnusedParameter = false  # MCP server handlers often have unused params like "name"
reportPrivateUsage = false  # Tests need to access private members for validation

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py", "test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
